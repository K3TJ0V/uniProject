<aside class="dashboard">
    <header class="dashboard__header">
        <div class="dashboard__header--logo">CM</div>
        <div class="dashboard__header--text">
            <h1 class="dashboard__header--h1">Competition</h1>
            <span class="dashboard__header--sub">Manager</span>
        </div>
    </header>

    <nav class="dashboard__nav">
        <span class="dashboard__nav--label">Menu</span>
        <ul class="nav-list">
            <li class="nav-list__li">
                <a routerLink="/" routerLinkActive="nav-list__li--active" [routerLinkActiveOptions]="{exact: true}" class="nav-list__li--link">
                    <span class="nav-list__li--bullet"></span>
                    <span>Home</span>
                </a>
            </li>
            <li class="nav-list__li">
                <a routerLink="/users" routerLinkActive="nav-list__li--active" class="nav-list__li--link">
                    <span class="nav-list__li--bullet"></span>
                    <span>Users</span>
                </a>
            </li>
            <li class="nav-list__li">
                <a routerLink="/events" routerLinkActive="nav-list__li--active" class="nav-list__li--link">
                    <span class="nav-list__li--bullet"></span>
                    <span>Events</span>
                </a>
            </li>
            <li class="nav-list__li">
                <a routerLink="/event-creator" routerLinkActive="nav-list__li--active" class="nav-list__li--link">
                    <span class="nav-list__li--bullet"></span>
                    <span>Event creator</span>
                </a>
            </li>
        </ul>
    </nav>

    <footer class="dashboard__footer">
        <span class="dashboard__footer--tag">STRENGTH · POWER · GLORY</span>
    </footer>
</aside>
